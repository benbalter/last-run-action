name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  prepare:
    name: Install & Cache
    runs-on: ubuntu-latest
    outputs:
      node-version: '20'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache node_modules (copy)
        run: tar -czf node_modules.tgz node_modules
      - name: Upload deps artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deps-node_modules
          path: node_modules.tgz

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download deps
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: deps-node_modules
      - name: Extract deps
        run: tar -xzf node_modules.tgz
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download deps
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: deps-node_modules
      - name: Extract deps
        run: tar -xzf node_modules.tgz
      - name: Test
        run: npm test -- --coverage
      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage

  build:
    name: Build & Dist Freshness
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download deps
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: deps-node_modules
      - name: Extract deps
        run: tar -xzf node_modules.tgz
      - name: Build Action bundle
        run: npm run build
      - name: Verify dist is up to date
        run: |
          if ! git diff --quiet --exit-code -- dist; then
            echo '::error::dist/ is not up to date. Run npm run build and commit the changes.'
            git --no-pager diff -- dist
            exit 1
          fi
