name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --coverage
      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage

  build:
    # Kept under its old name because branch rules require a check called
    # "Build & Dist Freshness". dist/ is no longer committed (script/release builds it),
    # so this only checks that the bundle builds.
    name: Build & Dist Freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build Action bundle
        run: npm run build
      - name: Check the bundle exists
        run: test -f dist/index.js
