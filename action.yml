name: 'Last Run Action'
description: 'Determine when a workflow was last run and/or update the last run time.'
author: 'Ben Balter'
branding:
  color: 'blue'
  icon: 'clock'
inputs:
  mode:
    description: "Operation mode: 'get', 'set', or 'get-and-set'."
    required: false
    default: 'get'
  fail-if-missing:
    description: 'If true and no previous timestamp is found (or invalid), the action fails.'
    required: false
    default: 'false'
  key:
    description: 'Name of the artifact that stores the timestamp. Use a distinct key per workflow (or per branch) to track them independently. Characters invalid in artifact names (e.g. `/`) are replaced with `-`.'
    required: false
    default: 'last-run'
  retention-days:
    description: "Days to retain the stored timestamp artifact. Values above the repository's artifact retention limit are capped to it."
    required: false
    default: '90'
  token:
    description: 'GitHub token used to list and download artifacts from previous runs. Requires `actions: read`.'
    required: false
    default: ${{ github.token }}
outputs:
  last-run:
    description: 'The last time the workflow was run, in ISO 8601 format.'
  first-run:
    description: "'true' when no prior timestamp was found (first run / newly seeded); 'false' otherwise. Only meaningful for modes that include `get`."
  current-run:
    description: 'The timestamp stored by this run, in ISO 8601 format. Set whenever a timestamp is uploaded.'
runs:
  using: 'node24'
  main: 'dist/index.js'
